<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>water guide</title>
    <link rel="stylesheet" href="/src/water-guide/style.css" />
  </head>
  <body>
    <main id="water-guide" class="water-guide" aria-live="off">
      <section class="status-stack">
        <strong id="destination" class="destination">CHỜ VỊ TRÍ</strong>

      </section>

      <div id="uturn" class="uturn hidden" aria-hidden="true">↶ QUAY ĐẦU</div>

      <div id="ray" class="ray hidden" aria-hidden="true">
        <div class="ray-line"></div>
        <i style="--i: 1"></i>
        <i style="--i: 2"></i>
        <i style="--i: 3"></i>
        <i style="--i: 4"></i>
        <i style="--i: 5"></i>
        <i style="--i: 6"></i>
        <i style="--i: 7"></i>
        <i style="--i: 8"></i>
      </div>
    </main>
    <script type="module" src="/src/water-guide/main.ts"></script>
  </body>
</html>
