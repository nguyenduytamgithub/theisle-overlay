<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>water guide</title>
    <link rel="stylesheet" href="/src/water-guide/style.css" />
  </head>
  <body>
    <main id="water-guide" class="water-guide" aria-live="off">
      <section class="status-stack">
        <strong id="destination" class="destination">CHỜ VỊ TRÍ</strong>
        <span id="instruction" class="instruction">CHỜ SERVER</span>
      </section>

      <section id="board" class="nav-board hidden" aria-hidden="true">
        <div class="compass-disc">
          <span class="cardinal cardinal-north">BẮC</span>
          <span class="cardinal cardinal-east">ĐÔNG</span>
          <span class="cardinal cardinal-south">NAM</span>
          <span class="cardinal cardinal-west">TÂY</span>
          <div class="axis axis-north-south"></div>
          <div class="axis axis-east-west"></div>
          <div id="target-needle" class="needle target-needle hidden">
            <span>ĐÍCH</span>
          </div>
          <div id="movement-needle" class="needle movement-needle hidden">
            <span>ĐANG ĐI</span>
          </div>
          <div class="compass-centre"></div>
        </div>
        <div class="board-legend">
          <span class="legend-target">◆ KIM ĐÍCH</span>
          <span class="legend-movement">◆ KIM ĐANG ĐI</span>
        </div>
      </section>
    </main>
    <script type="module" src="/src/water-guide/main.ts"></script>
  </body>
</html>
